---
- hosts: db
  become: true
  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installer MySQL
      apt:
        name: mysql-server
        state: present

    - name: Écouter sur toutes les interfaces (accès depuis vm-app)
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: restart mysql

    - name: S'assurer que MySQL tourne
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Créer la base et l'utilisateur applicatif (restreint à vm-app)
      shell: |
        mysql -uroot <<SQL
        CREATE DATABASE IF NOT EXISTS {{ db_name }};
        CREATE USER IF NOT EXISTS '{{ db_user }}'@'{{ app_ip }}' IDENTIFIED BY '{{ db_password }}';
        GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'{{ app_ip }}';
        FLUSH PRIVILEGES;
        SQL
      args:
        executable: /bin/bash

  handlers:
    - name: restart mysql
      service:
        name: mysql
        state: restarted
