---
- name: Installer Python et dépendances
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Créer le répertoire de l'app
  file:
    path: /opt/demoapp
    state: directory

- name: Créer le venv et installer Flask + pymysql
  pip:
    name:
      - flask
      - pymysql
    virtualenv: /opt/demoapp/venv
    virtualenv_command: python3 -m venv

- name: Déployer app.py
  template:
    src: app.py.j2
    dest: /opt/demoapp/app.py

- name: Déployer le service systemd
  template:
    src: demoapp.service.j2
    dest: /etc/systemd/system/demoapp.service
  notify: restart demoapp

- name: Activer et démarrer le service
  systemd:
    name: demoapp
    enabled: true
    state: started
    daemon_reload: true
